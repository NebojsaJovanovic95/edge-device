./k8s/api/api-router-hpa.yml
apiVersion: autoscalling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: yolov8-server-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: yolov8-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
./k8s/api/api-router-load-balancing.yml
apiVersion: v1
kind: Service
metadata:
  name: yolov8_server
spec:
  selector:
    app: yolov8_server
  ports:
  - port: 5000
    targetPort: 5000
./k8s/api/api-router.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolov8_server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yolov8_server
  template:
    metadata:
      labels:
        app: yolov8_server
  spec:
    containers:
    - name: api
      image: yolov8_server:latest
      ports:
      - containerPort: 5000
      env:
      - name: REDIS_HOST
        value: redis
      readinessProbe:
        httpGet:
          path: /health
          port: 5000
./k8s/model/model.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolov8_model
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolov8_model
  template:
    metadata:
      labels:
        app: yolov8_model
    spec:
      containers:
      - name: yolov8_model
        image: yolov8_model:latest
        volumeMounts:
        - name: models
          mountPath: /app/model
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: models-pvc
./k8s/streaming/keda.yml
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: streaming-app-scaler
spec:
  scaleTargetRef:
    name: streaming-app
  minReplicaCount: 0
  maxReplicaCount: 100
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
  - type: redis
    metadata:
      address: redis:6379
      listName: cameras:pending
      listLength: "1"
./k8s/streaming/streaming.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streaming-app
spec:
  replicas: 0
  selector:
    matchLabels:
      app: streaming-app
  template:
    metadata:
      labels:
        app: streaming-app
    spec:
      containers:
      - name: streaming
        image: streaming-app:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: REDIS_HOST
          value: redis
        - name: REDIS_PORT
          value: "6379"
        - name: CAMERA_QUEUE
          value: cameras:pending
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - "exit 0"
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - "exit 0"
./k8s/redis.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
          - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
./k8s/postgres.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
          - name: POSTGRES_PASSWORD
            value: "secret" # USE SECRET IN PRODUCTION
          - name: POSTGRES_DB
            value: observer
          - name: POSTGRES_USER
            value: myuser
        ports:
        - containerPort: 5432
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
./k8s/minio.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
            - server
            - /data
            - --console-address
            - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: "minio_access_key"
        - name: "MINIO_ROOT_PASSWORD"
          value: "minio_secret_key"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
