apiVersion: apps/v1
kind: Deployment
metadata:
  name: yolov8-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yolov8-server
  template:
    metadata:
      labels:
        app: yolov8-server
    spec:
      containers:
        - name: yolov8-server
          image: yolov8-server:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
