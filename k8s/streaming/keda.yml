apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: streaming-app-scaler
spec:
  scaleTargetRef:
    name: streaming-app
  minReplicaCount: 0
  maxReplicaCount: 100
  pollingInterval: 5
  cooldownPeriod: 30
  triggers:
  - type: redis
    metadata:
      address: redis:6379
      listName: cameras:pending
      listLength: "1"
