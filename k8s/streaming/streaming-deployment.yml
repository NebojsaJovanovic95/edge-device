apiVersion: app/v1
kind: Deployment
metadata:
  name: streaming-app
spec:
  replicas: 1
  selector:
    mathLabels:
      app: streaming-app
  template:
    metadata:
      labels:
        app: streaming-app
    spec:
      containers:
      - name: streaming-app
        image: nebojsajovanovic/streaming-app:latest
        imagePullPolicy: Always
        envFrom:
          - configMapRef:
            name: streaming-app-config
        ports:
          - containerPort: 8000
        volumeMounts:
          - mountPath: /app/logs
            name: storage
          - mountPath: /app/images
            name: storage
          - mountPath: /dev/video0
            name: camera-device
          readinessProbe:
            tcpSocket:
              port: 8000
          initialDelaySeconds: 5

