apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:latest
        args:
            - server
            - /data
            - --console-address
            - ":9001"
        env:
        - name: MINIO_ROOT_USER
          value: "minio_access_key"
        - name: "MINIO_ROOT_PASSWORD"
          value: "minio_secret_key"
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - name: minio-data
          mountPath: /data
      volumes:
      - name: minio-data
        persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: persistentVolumeClaim
metadata:
  name: minio-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector:
    app: minio
  ports:
    - port: 9000
      targetPort: 9000
